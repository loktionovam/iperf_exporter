apiVersion: v1
kind: Service
metadata:
  name: {{ include "iperf-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iperf-operator.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "iperf-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 9869
      targetPort: metrics
      protocol: TCP
