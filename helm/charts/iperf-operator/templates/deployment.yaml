apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "iperf-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iperf-operator.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "iperf-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "iperf-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "iperf-operator.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - kopf
            - run
            - --standalone
            - --namespace={{ .Release.Namespace }}
            - -m
            - iperf_operator.controller
          env:
            - name: IPERF_OPERATOR_DEFAULT_EXPORTER_IMAGE
              value: "{{ .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag | default .Chart.AppVersion }}"
            - name: IPERF_OPERATOR_LOCAL_CLUSTER_NAME
              value: {{ required "localClusterName must not be empty" .Values.localClusterName | quote }}
            - name: IPERF_OPERATOR_METRICS_PORT
              value: "9869"
          ports:
            - name: metrics
              containerPort: 9869
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
