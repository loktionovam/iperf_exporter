{{- range $resource := list "measurementprofiles" "linkmeasurements" "measurementsessions" "remoteclusters" -}}
{{- $name := printf "%s.netperf.iperfexporter.io" $resource -}}
{{- $crd := lookup "apiextensions.k8s.io/v1" "CustomResourceDefinition" "" $name -}}
{{- if $crd -}}
{{- range $version := $crd.spec.versions -}}
{{- if contains "alpha" $version.name -}}
{{- fail (printf "Existing alpha CRD %s is incompatible with iperf-operator v4. A clean installation is required; no existing resources have been removed." $name) -}}
{{- end -}}
{{- end -}}
{{- range $version := $crd.status.storedVersions -}}
{{- if contains "alpha" $version -}}
{{- fail (printf "Existing alpha data in CRD %s is incompatible with iperf-operator v4. A clean installation is required; no existing resources have been removed." $name) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
