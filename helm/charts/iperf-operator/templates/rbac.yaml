apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "iperf-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iperf-operator.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "iperf-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iperf-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [netperf.iperfexporter.io]
    resources: [measurementprofiles, linkmeasurements, remoteclusters]
    verbs: [get, list, watch, patch]
  - apiGroups: [netperf.iperfexporter.io]
    resources: [measurementsessions]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [netperf.iperfexporter.io]
    resources:
      - measurementprofiles/status
      - linkmeasurements/status
      - measurementsessions/status
      - remoteclusters/status
      - measurementprofiles/finalizers
      - linkmeasurements/finalizers
      - measurementsessions/finalizers
      - remoteclusters/finalizers
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, patch, delete]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "iperf-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "iperf-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "iperf-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "iperf-operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "iperf-operator.clusterRoleName" . }}
  labels:
    {{- include "iperf-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "iperf-operator.clusterRoleName" . }}
  labels:
    {{- include "iperf-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "iperf-operator.clusterRoleName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "iperf-operator.fullname" . }}
    namespace: {{ .Release.Namespace }}
