apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: measurementprofiles.netperf.iperfexporter.io
spec:
  group: netperf.iperfexporter.io
  names:
    kind: MeasurementProfile
    plural: measurementprofiles
    singular: measurementprofile
    shortNames:
      - mprofile
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Protocol
          type: string
          jsonPath: .spec.protocol
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - protocol
              properties:
                protocol:
                  type: string
                  enum:
                    - tcp
                    - udp
                exporter:
                  type: object
                  properties:
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    bindPort:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    interval:
                      type: integer
                      minimum: 1
                    len:
                      type: integer
                      minimum: 1
                    metricTTL:
                      type: integer
                      minimum: 0
                    debug:
                      type: boolean
                    clientBandwidth:
                      type: string
                    clientDuration:
                      type: integer
                      minimum: 1
                    serverAdditionalParams:
                      type: string
                    clientAdditionalParams:
                      type: string
                    contextClientBandwidth:
                      type: string
                    contextClientAdditionalParams:
                      type: string
                    pathTraceTTL:
                      type: integer
                      minimum: 0
                    pathTraceMaxHops:
                      type: integer
                      minimum: 1
                    pathTraceTimeout:
                      type: integer
                      minimum: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
