apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: measurementsessions.netperf.iperfexporter.io
spec:
  group: netperf.iperfexporter.io
  names:
    kind: MeasurementSession
    plural: measurementsessions
    singular: measurementsession
    shortNames:
      - msession
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Protocol
          type: string
          jsonPath: .spec.protocol
        - name: Direction
          type: string
          jsonPath: .spec.direction
        - name: Mode
          type: string
          jsonPath: .spec.networkMode
        - name: Src
          type: string
          jsonPath: .spec.source.nodeName
        - name: Dst
          type: string
          jsonPath: .spec.destination.nodeName
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - measurementRef
                - profileRef
                - protocol
                - direction
                - networkMode
                - source
                - destination
                - execution
                - runtime
                - exporter
              properties:
                measurementRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                profileRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                protocol:
                  type: string
                  enum:
                    - tcp
                    - udp
                direction:
                  type: string
                  enum:
                    - sourceToDestination
                    - destinationToSource
                networkMode:
                  type: string
                  enum:
                    - host
                    - pod
                    - service
                source:
                  type: object
                  required:
                    - cluster
                    - nodeName
                    - nodeAddress
                  properties:
                    cluster:
                      type: string
                      minLength: 1
                    nodeName:
                      type: string
                      minLength: 1
                    nodeAddress:
                      type: string
                      minLength: 1
                destination:
                  type: object
                  required:
                    - cluster
                    - nodeName
                    - nodeAddress
                  properties:
                    cluster:
                      type: string
                      minLength: 1
                    nodeName:
                      type: string
                      minLength: 1
                    nodeAddress:
                      type: string
                      minLength: 1
                execution:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                        - continuous
                        - probe
                        - periodicProbe
                    every:
                      type: string
                      pattern: '^[1-9][0-9]*[smhd]?$'
                    everySeconds:
                      type: integer
                      minimum: 1
                    durationSeconds:
                      type: integer
                      minimum: 1
                runtime:
                  type: object
                  required:
                    - image
                    - imagePullPolicy
                  properties:
                    image:
                      type: string
                      minLength: 1
                    imagePullPolicy:
                      type: string
                      enum:
                        - Always
                        - IfNotPresent
                        - Never
                exporter:
                  type: object
                  required:
                    - protocol
                    - port
                    - bindPort
                    - interval
                    - len
                    - metricTTL
                    - debug
                    - clientBandwidth
                    - clientDuration
                    - serverAdditionalParams
                    - clientAdditionalParams
                    - contextClientBandwidth
                    - contextClientAdditionalParams
                    - pathTraceTTL
                    - pathTraceMaxHops
                    - pathTraceTimeout
                  properties:
                    protocol:
                      type: string
                      enum:
                        - tcp
                        - udp
                    port:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    bindPort:
                      type: integer
                      minimum: 1
                      maximum: 65535
                    interval:
                      type: integer
                      minimum: 1
                    len:
                      type: integer
                      minimum: 1
                    metricTTL:
                      type: integer
                      minimum: 0
                    debug:
                      type: boolean
                    clientBandwidth:
                      type: string
                    clientDuration:
                      type: integer
                      minimum: 1
                    serverAdditionalParams:
                      type: string
                    clientAdditionalParams:
                      type: string
                    contextClientBandwidth:
                      type: string
                    contextClientAdditionalParams:
                      type: string
                    pathTraceTTL:
                      type: integer
                      minimum: 0
                    pathTraceMaxHops:
                      type: integer
                      minimum: 1
                    pathTraceTimeout:
                      type: integer
                      minimum: 1
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
