apiVersion: netperf.iperfexporter.io/v1
kind: MeasurementProfile
metadata:
  name: tcp-quality-continuous
  namespace: iperf-exporter-demo
spec:
  protocol: tcp
  exporter:
    port: 5001
    bindPort: 9868
    interval: 1
    len: 8192
    metricTTL: 120
    clientBandwidth: 5M
    clientDuration: 315360000
    clientAdditionalParams: --trip-times
    serverAdditionalParams: --histograms=100u,20
    pathTraceTTL: 60
    pathTraceMaxHops: 8
    pathTraceTimeout: 5
