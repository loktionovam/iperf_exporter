apiVersion: netperf.iperfexporter.io/v1
kind: LinkMeasurement
metadata:
  name: udp-probe-demo
  namespace: iperf-exporter-demo
spec:
  profileRef: udp-loss-probe
  source:
    cluster: cluster-a
    nodeName: iperf-demo-worker
  destination:
    cluster: cluster-a
    nodeName: iperf-demo-worker2
  directions:
    - sourceToDestination
    - destinationToSource
  networkModes:
    - host
    - pod
    - service
  execution:
    mode: probe
    durationSeconds: 180
