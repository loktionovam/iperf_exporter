apiVersion: netperf.iperfexporter.io/v1alpha1
kind: MeasurementProfile
metadata:
  name: udp-loss-probe
  namespace: iperf-exporter-demo
spec:
  protocol: udp
  exporter:
    port: 5004
    bindPort: 9871
    interval: 1
    len: 1280
    metricTTL: 120
    clientBandwidth: 80M
    clientDuration: 180
    pathTraceTTL: 60
    pathTraceMaxHops: 8
    pathTraceTimeout: 5
