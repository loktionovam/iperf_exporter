apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: iperf-exporter-operator
rules:
  - apiGroups:
      - netperf.iperfexporter.io
    resources:
      - measurementprofiles
      - linkmeasurements
      - measurementsessions
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - netperf.iperfexporter.io
    resources:
      - measurementprofiles/status
      - linkmeasurements/status
      - measurementsessions/status
      - measurementprofiles/finalizers
      - linkmeasurements/finalizers
      - measurementsessions/finalizers
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - services
      - nodes
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
