apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: linkmeasurements.netperf.iperfexporter.io
spec:
  group: netperf.iperfexporter.io
  names:
    kind: LinkMeasurement
    plural: linkmeasurements
    singular: linkmeasurement
    shortNames:
      - lmeasure
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Profile
          type: string
          jsonPath: .spec.profileRef
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - profileRef
                - source
                - destination
              properties:
                profileRef:
                  type: string
                  minLength: 1
                source:
                  type: object
                  required:
                    - nodeName
                  properties:
                    cluster:
                      type: string
                      minLength: 1
                    nodeName:
                      type: string
                      minLength: 1
                destination:
                  type: object
                  required:
                    - nodeName
                  properties:
                    cluster:
                      type: string
                      minLength: 1
                    nodeName:
                      type: string
                      minLength: 1
                directions:
                  type: array
                  minItems: 1
                  maxItems: 2
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    enum:
                      - sourceToDestination
                      - destinationToSource
                networkModes:
                  type: array
                  minItems: 1
                  maxItems: 3
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    enum:
                      - host
                      - pod
                      - service
                execution:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                        - continuous
                        - probe
                        - periodicProbe
                    every:
                      type: string
                      pattern: '^[1-9][0-9]*[smhd]?$'
                    durationSeconds:
                      type: integer
                      minimum: 1
                runtime:
                  type: object
                  properties:
                    image:
                      type: string
                      minLength: 1
                    imagePullPolicy:
                      type: string
                      enum:
                        - Always
                        - IfNotPresent
                        - Never
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
