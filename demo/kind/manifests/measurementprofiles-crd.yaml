apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: measurementprofiles.netperf.iperfexporter.io
spec:
  group: netperf.iperfexporter.io
  names:
    kind: MeasurementProfile
    plural: measurementprofiles
    singular: measurementprofile
    shortNames:
      - mprofile
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Protocol
          type: string
          jsonPath: .spec.protocol
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - protocol
              properties:
                protocol:
                  type: string
                  enum:
                    - tcp
                    - udp
                exporter:
                  type: object
                  properties:
                    port:
                      type: integer
                    bindPort:
                      type: integer
                    interval:
                      type: integer
                    len:
                      type: integer
                    metricTTL:
                      type: integer
                    debug:
                      type: boolean
                    clientBandwidth:
                      type: string
                    clientDuration:
                      type: integer
                    serverAdditionalParams:
                      type: string
                    clientAdditionalParams:
                      type: string
                    contextClientBandwidth:
                      type: string
                    contextClientAdditionalParams:
                      type: string
                    pathTraceTTL:
                      type: integer
                    pathTraceMaxHops:
                      type: integer
                    pathTraceTimeout:
                      type: integer
                    env:
                      type: object
                      additionalProperties:
                        type: string
                    serverEnv:
                      type: object
                      additionalProperties:
                        type: string
                    clientEnv:
                      type: object
                      additionalProperties:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
      subresources:
        status: {}
