apiVersion: apps/v1
kind: Deployment
metadata:
  name: iperf-exporter-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iperf-exporter-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iperf-exporter-operator
    spec:
      serviceAccountName: iperf-exporter-operator
      containers:
        - name: operator
          image: iperf_operator:kind-demo
          imagePullPolicy: IfNotPresent
          command:
            - kopf
            - run
            - --standalone
            - -A
            - -m
            - iperf_operator.controller
          env:
            - name: IPERF_OPERATOR_DEFAULT_EXPORTER_IMAGE
              value: iperf_exporter:kind-demo
