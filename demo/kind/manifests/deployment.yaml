apiVersion: apps/v1
kind: Deployment
metadata:
  name: iperf-exporter-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: iperf-exporter-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iperf-exporter-operator
    spec:
      serviceAccountName: iperf-exporter-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: iperf_operator:kind-demo
          imagePullPolicy: IfNotPresent
          command:
            - kopf
            - run
            - --standalone
            - --namespace=iperf-exporter-demo
            - -m
            - iperf_operator.controller
          ports:
            - name: metrics
              containerPort: 9869
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          env:
            - name: IPERF_OPERATOR_DEFAULT_EXPORTER_IMAGE
              value: iperf_exporter:kind-demo
            - name: IPERF_OPERATOR_METRICS_PORT
              value: "9869"
      volumes:
        - name: tmp
          emptyDir: {}
