# Periodic TCP quality probe.
# Run this when you want repeated TCP quality sampling on a schedule instead of
# keeping client traffic on continuously.
apiVersion: netperf.iperfexporter.io/v1
kind: MeasurementProfile
metadata:
  name: tcp-quality-periodic
spec:
  protocol: tcp
  exporter:
    port: 5005
    bindPort: 9872
    interval: 1
    len: 8192
    metricTTL: 120
    clientBandwidth: 20M
    clientDuration: 180
    clientAdditionalParams: --trip-times
    serverAdditionalParams: --histograms=100u,20
    pathTraceTTL: 60
    pathTraceMaxHops: 8
    pathTraceTimeout: 5
