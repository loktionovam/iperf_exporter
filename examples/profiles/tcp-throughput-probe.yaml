# Short higher-rate TCP burst.
# Run this when you want to answer "what throughput can this path sustain right
# now?" or compare host/pod/service datapaths under burst load.
apiVersion: netperf.iperfexporter.io/v1
kind: MeasurementProfile
metadata:
  name: tcp-throughput-probe
spec:
  protocol: tcp
  exporter:
    port: 5003
    bindPort: 9870
    interval: 1
    len: 8192
    metricTTL: 120
    clientBandwidth: 200M
    clientDuration: 180
    clientAdditionalParams: --trip-times
    serverAdditionalParams: --histograms=100u,20
    pathTraceTTL: 60
    pathTraceMaxHops: 8
    pathTraceTimeout: 5
