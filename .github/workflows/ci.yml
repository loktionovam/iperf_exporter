name: IPerf exporter CI

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  apps:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Test applications
        run: make test-apps
      - name: Audit Python dependencies
        if: matrix.python-version == '3.14'
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
          pip-audit -r requirements-operator.txt
      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          use_oidc: true

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Install chart test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate Helm, Kustomize, Compose, and dashboards
        run: |
          make validate-manifests
          make test-charts build-charts
          helm template udp-test helm/charts/iperf-exporter-server >/dev/null
          helm template tcp-test helm/charts/iperf-exporter-server \
            --set server.config.proto=tcp \
            --set client.config.proto=tcp >/dev/null
      - name: Lint Dockerfiles
        run: |
          docker run --rm -i hadolint/hadolint:v2.14.0 < Dockerfile
          docker run --rm -i hadolint/hadolint:v2.14.0 < Dockerfile.operator

  images:
    runs-on: ubuntu-24.04
    needs:
      - apps
      - manifests
    env:
      IPERF_EXPORTER_IMAGE_NAME: ghcr.io/loktionovam/iperf_exporter_server
      IPERF_OPERATOR_IMAGE_NAME: ghcr.io/loktionovam/iperf_operator
      IPERF_EXPORTER_IMAGE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ci-{0}', github.run_id) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      - name: Build exporter and operator images
        run: make build-images
      - name: Run container smoke tests
        run: |
          python -m pip install -r requirements-test.txt
          make test-images
          docker run --rm --entrypoint python \
            "${IPERF_OPERATOR_IMAGE_NAME}:${IPERF_EXPORTER_IMAGE_TAG}" \
            -c "import iperf_operator.controller"
      - name: Scan exporter image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/loktionovam/iperf_exporter_server:${{ env.IPERF_EXPORTER_IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan operator image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/loktionovam/iperf_operator:${{ env.IPERF_EXPORTER_IMAGE_TAG }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Save tested images
        shell: bash
        run: |
          docker save \
            "${IPERF_EXPORTER_IMAGE_NAME}:${IPERF_EXPORTER_IMAGE_TAG}" \
            "${IPERF_OPERATOR_IMAGE_NAME}:${IPERF_EXPORTER_IMAGE_TAG}" \
            | gzip > "${RUNNER_TEMP}/tested-images.tar.gz"
      - name: Upload tested images
        uses: actions/upload-artifact@v7
        with:
          name: tested-images
          path: ${{ runner.temp }}/tested-images.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
          overwrite: true

  kind-e2e:
    runs-on: ubuntu-24.04
    needs:
      - images
    timeout-minutes: 45
    env:
      EXPORTER_IMAGE_NAME: ghcr.io/loktionovam/iperf_exporter_server:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ci-{0}', github.run_id) }}
      OPERATOR_IMAGE_NAME: ghcr.io/loktionovam/iperf_operator:${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('ci-{0}', github.run_id) }}
      SKIP_IMAGE_BUILD: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: azure/setup-helm@v5
      - name: Install kind and test dependencies
        run: |
          go install sigs.k8s.io/kind@v0.29.0
          sudo install "$(go env GOPATH)/bin/kind" /usr/local/bin/kind
          python -m pip install -r requirements-dev.txt
      - name: Download tested images
        uses: actions/download-artifact@v8
        with:
          name: tested-images
          path: ${{ runner.temp }}/tested-images
      - name: Load tested images
        run: docker load --input "${RUNNER_TEMP}/tested-images/tested-images.tar.gz"
      - name: Run two-cluster kind test with tested images
        run: make demo-kind-up
      - name: Run Helm TCP and UDP service tests
        run: |
          for proto in udp tcp; do
            helm upgrade --install "helm-${proto}" \
              helm/charts/iperf-exporter-server \
              --kube-context kind-iperf-demo \
              --namespace "helm-${proto}" \
              --create-namespace \
              --set-string image.repository="${EXPORTER_IMAGE_NAME%:*}" \
              --set-string image.tag="${EXPORTER_IMAGE_NAME##*:}" \
              --set image.pullPolicy=Never \
              --set "server.config.proto=${proto}" \
              --set "client.config.proto=${proto}"
            kubectl --context kind-iperf-demo \
              --namespace "helm-${proto}" \
              rollout status deployment \
              --selector app.kubernetes.io/component=server \
              --timeout=180s
            helm test "helm-${proto}" \
              --kube-context kind-iperf-demo \
              --namespace "helm-${proto}" \
              --logs \
              --timeout=120s
          done
      - name: Report kind failure diagnostics
        if: failure()
        run: |
          sessions="$(kubectl --context kind-iperf-demo \
            --namespace iperf-exporter-demo \
            get measurementsessions \
            -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,JOB:.status.clientJobName \
            2>&1 | tr '\n' ';')"
          jobs="$(kubectl --context kind-iperf-demo \
            --namespace iperf-exporter-demo \
            get jobs \
            -o custom-columns=NAME:.metadata.name,UID:.metadata.uid,ACTIVE:.status.active,SUCCEEDED:.status.succeeded,FAILED:.status.failed \
            2>&1 | tr '\n' ';')"
          echo "::error title=kind-e2e diagnostics::sessions=${sessions} jobs=${jobs}"
      - name: Tear down kind clusters
        if: always()
        run: make demo-kind-down

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs:
      - apps
      - manifests
      - images
      - kind-e2e
    permissions:
      contents: write
      packages: write
    env:
      IPERF_EXPORTER_IMAGE_NAME: ghcr.io/loktionovam/iperf_exporter_server
      IPERF_OPERATOR_IMAGE_NAME: ghcr.io/loktionovam/iperf_operator
      IPERF_EXPORTER_IMAGE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - name: Configure Git
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
      - name: Prepare charts and release notes
        run: |
          make build-charts
          awk -v version="${GITHUB_REF_NAME}" '
            $1 == "##" && $2 == version { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          test -s "${RUNNER_TEMP}/release-notes.md"
      - name: Download tested images
        uses: actions/download-artifact@v8
        with:
          name: tested-images
          path: ${{ runner.temp }}/tested-images
      - name: Load tested images
        run: docker load --input "${RUNNER_TEMP}/tested-images/tested-images.tar.gz"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested images
        run: make push-images
      - name: Publish charts
        uses: helm/chart-releaser-action@3e001cb8c68933439c7e721650f20a07a1a5c61e
        with:
          charts_dir: helm/charts
          skip_packaging: true
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
